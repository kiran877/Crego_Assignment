name: Tenant Onboarding

on:
  push:
    paths:
      - 'tenants.yaml'

jobs:
  onboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Extract Tenant Info
        id: tenant_info
        run: |
          # Simplified: Get the last added tenant name from tenants.yaml
          # In a real scenario, you might diff the file to find exactly what changed
          TENANT_NAME=$(yq e '.tenants[-1].name' tenants.yaml)
          echo "tenant_name=$TENANT_NAME" >> $GITHUB_OUTPUT

      - name: Terraform Plan
        run: |
          cd task1/terraform
          terraform init
          terraform plan -var="tenant_name=${{ steps.tenant_info.outputs.tenant_name }}" \
                         -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
                         -var="instance_name=main-instance" \
                         -out=tfplan
          terraform show tfplan > ../plan.txt

      - name: Template K8s Manifests
        run: |
          TENANT=${{ steps.tenant_info.outputs.tenant_name }}
          sed "s/{{TENANT_NAME}}/$TENANT/g" task1/k8s/rbac.yaml > task1/k8s/$TENANT-rbac.yaml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Onboard tenant: ${{ steps.tenant_info.outputs.tenant_name }}"
          title: "New Tenant Onboarding: ${{ steps.tenant_info.outputs.tenant_name }}"
          body: |
            This PR was automatically generated by the Tenant Onboarding workflow.
            It includes:
            - Terraform plan for database provisioning.
            - K8s Namespace and RBAC manifests.
          branch: "onboard-${{ steps.tenant_info.outputs.tenant_name }}"
          base: main
