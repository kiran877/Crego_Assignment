name: PR Infrastructure Diff

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/k8s/**'
      - '**/kustomize/**'

jobs:
  kustomize-diff:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout PR Branch (Head)
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: head

      - name: Checkout Base Branch (Main)
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Setup Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Run Kustomize Build on Base (Main)
        run: |
          cd base
          # Build kustomize output. We assume there's a kustomization.yaml or similar in GKE configs
          # For testing, we mock this by building the K8s directory if it has kustomization
          if [ -f task1/k8s/kustomization.yaml ]; then
            kustomize build task1/k8s > ../base-manifests.yaml
          else
            # Fallback mock for standard k8s manifests if Kustomize is not configured yet
            echo "Mocking base branch resources" > ../base-manifests.yaml
            cat task1/k8s/*.yaml >> ../base-manifests.yaml 2>/dev/null || true
          fi

      - name: Run Kustomize Build on Head (PR Branch)
        run: |
          cd head
          if [ -f task1/k8s/kustomization.yaml ]; then
            kustomize build task1/k8s > ../head-manifests.yaml
          else
            echo "Mocking PR branch resources" > ../head-manifests.yaml
            cat task1/k8s/*.yaml >> ../head-manifests.yaml 2>/dev/null || true
          fi

      - name: Generate Diff
        id: generate_diff
        run: |
          echo "diff_output<<EOF" >> $GITHUB_ENV
          if [ -f base-manifests.yaml ] && [ -f head-manifests.yaml ]; then
            diff -u base-manifests.yaml head-manifests.yaml >> $GITHUB_ENV || true
          else
            echo "Manifest comparison files not found." >> $GITHUB_ENV
          fi
          echo "EOF" >> $GITHUB_ENV

      - name: Post Diff Comment to PR
        uses: actions/github-script@v6
        with:
          script: |
            const diff = process.env.diff_output;
            const body = `### 🔍 Infrastructure Change Diff (Kustomize Build)
            
            \`\`\`diff
            ${diff || 'No infrastructure changes detected.'}
            \`\`\`
            
            *Automated comparison generated by PR Infrastructure Diff workflow.*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
